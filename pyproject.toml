[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunspots"
version = "0.1.0"
description = "Sunspot tracking, detection, and area calculation using Bradley-Roth adaptive thresholding"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Soumit Dey", email = "your.email@example.com"}
]
keywords = [
    "sunspots",
    "image-processing",
    "astronomy",
    "bradley-roth",
    "adaptive-thresholding",
    "solar-tracking"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.3.0",
    "scipy>=1.5.0",
    "scikit-image>=0.18.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.5",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.12",
]
jupyter = [
    "jupyter>=1.0",
    "notebook>=6.0",
    "ipykernel>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/Soumit65/Sunspots"
"Documentation" = "https://soumit65.github.io/Sunspots"
"Repository" = "https://github.com/Soumit65/Sunspots.git"
"Bug Tracker" = "https://github.com/Soumit65/Sunspots/issues"

[tool.setuptools]
packages = ["sunspots"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
